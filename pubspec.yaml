name: fintech_card_core
description: >
  A headless Flutter plugin providing a universal card-reading engine for
  Fintech apps — NFC (EMV/ISO 7816), OCR, and manual entry.
  Native NFC hardware bridge via MethodChannel; all APDU/EMV logic in Dart.
version: 0.1.0
homepage: https://github.com/example/fintech_card_core

environment:
  sdk: ^3.11.1
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

  # Camera (OCR text recognition is handled natively via fintech_card_core/ocr channel)
  camera: ^0.11.0

  # Model utilities
  equatable: ^2.0.7

  # FFI allocator helpers for the cardcv OpenCV pre-processing core
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.fintech_card_core
        pluginClass: FintechCardCorePlugin
      ios:
        pluginClass: FintechCardCorePlugin

  assets:
    - assets/logo_visa.png
    - assets/logo_mastercard.png
    - assets/logo_amex.png
    - assets/logo_discover.png
    - assets/logo_unionpay.png
    - assets/logo_jcb.png
    - assets/logo_humo.png
    - assets/logo_uzcard.png
