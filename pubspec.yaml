name: fintech_card_core
description: >
  A headless Flutter plugin providing a universal card-reading engine for
  Fintech apps — NFC (EMV/ISO 7816), OCR, manual entry, and mock testing.
  Native NFC hardware bridge via MethodChannel; all APDU/EMV logic in Dart.
version: 0.1.0
homepage: https://github.com/example/fintech_card_core

environment:
  sdk: ^3.11.1
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

  # Camera + OCR (Paddle Lite on-device; TFLite CRNN kept as legacy)
  camera: ^0.11.0
  image: ^4.5.4
  tflite_flutter: ^0.12.1
  flutter_paddle_ocr: ^0.0.2
  path_provider: ^2.1.6

  # Model utilities
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.fintech_card_core
        pluginClass: FintechCardCorePlugin
      ios:
        pluginClass: FintechCardCorePlugin

  assets:
    - assets/models/card_ocr.tflite
    - assets/models/paddle/det_db.nb
    - assets/models/paddle/rec_crnn.nb
    - assets/models/paddle/cls.nb
    - assets/models/paddle/ppocr_keys_v1.txt
    - assets/logo_visa.png
    - assets/logo_mastercard.png
    - assets/logo_humo.png
    - assets/logo_uzcard.png
